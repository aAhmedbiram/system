<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Pending Approval - Rival Gym System</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 560px;
            background: rgba(20, 20, 30, 0.9);
            border: 1px solid rgba(76, 175, 80, 0.25);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
            text-align: center;
        }
        h1 {
            margin: 0 0 12px 0;
            color: #7bff88;
        }
        p {
            margin: 0 0 14px 0;
            color: #d5dbe8;
            line-height: 1.6;
        }
        .status {
            margin: 18px 0;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255, 193, 7, 0.12);
            border: 1px solid rgba(255, 193, 7, 0.28);
            color: #ffe8a3;
            font-weight: 700;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 22px;
        }
        .btn {
            display: inline-block;
            padding: 11px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            border: 0;
            cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, #4caf50, #66d66a); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.14); }
        .username {
            color: #9fd8a5;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Your account is pending approval</h1>
        <p>Hello <span class="username">{{ current_user.username }}</span>,</p>
        <p>Your account has been created and is waiting for admin approval before you can access operational pages.</p>
        <div class="status">Your account is pending approval.</div>
        <div class="actions">
            <a class="btn btn-primary" href="{{ url_for('logout') }}">Logout</a>
            <a class="btn btn-secondary" href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </div>
</body>
</html>
